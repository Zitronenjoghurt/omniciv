[package]
name = "omniciv-app-egui"
description = "The egui app of the OmniCIV game."
version = "0.1.0"
edition.workspace = true

[dependencies]
omniciv-core = { workspace = true }
eframe = { version = "0.34.3", default-features = false, features = ["persistence", "wgpu"] }
egui = "0.34.3"
egui-notify = "0.22.0"
egui-phosphor = { version = "0.12.0", features = ["regular"] }